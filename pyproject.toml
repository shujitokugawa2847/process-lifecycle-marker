[project]
name = "process-lifecycle-marker"
version = "0.1.0"
description = "Emits startup and shutdown log records with boot_id and uptime, so log queries can bound sessions by process boundary markers."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
